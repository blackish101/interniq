# Render blueprint for InternIQ.
# Render reads this file from the repository root and creates the service from it,
# so there is nothing to fill in by hand beyond connecting the repo.
services:
  - type: web
    name: interniq
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: >-
      npm ci --prefix server &&
      npm ci --prefix client &&
      npm run build --prefix client
    # NODE_ENV is set here, not in envVars: as a build-time env var it would make
    # npm ci skip devDependencies, and Vite is a devDependency.
    startCommand: NODE_ENV=production npm start --prefix server
    envVars:
      # Render generates and stores this, so sessions survive a cold start
      # instead of every restart invalidating every signed-in user.
      - key: JWT_SECRET
        generateValue: true
